<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./main.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Produtos</title>
</head>
<body 
    class="bg-gray-100 flex flex-col items-center justify-center h-screen gap-5">
    <h1 
        class="text-2xl">
        Lista de Produtos
    </h1>
    <input 
        id="produto"
        type="text" 
        placeholder="Produto" 
        class="border rounded px-8 py-2">
    <input 
        id="codigo"
        type="text" 
        placeholder="Codigo"  
        class="border rounded px-8 py-2">
    <input 
        id="quantidade"
        type="text" 
        placeholder="Quantidade" 
        class="border rounded px-8 py-2">
    <button 
        id="btn"
        type="button"
        class="bg-blue-500 text-white border rounded px-4 py-2"
        onclick="resetarLista(), envio()">
       Adicionar
    </button>
    <div
        id="lista"
        class="h-64 overflow-y-auto flex flex-col gap-3 pr-2">
    </div>
</body>
</html>
